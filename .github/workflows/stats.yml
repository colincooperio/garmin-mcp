name: Usage stats

# Once a day, records GitHub's download count for every file attached to every
# release, appending one row per file to stats/downloads.csv on the "stats"
# branch (created, with no history, the first time). npm run usage reads it.
# The counts are anonymous: GitHub only counts downloads of public files.
# Only ever pushes to "stats"; never touches main.
#
# GitHub delays, and sometimes drops, scheduled runs, most of all near the top
# of the hour. So it's scheduled off the hour, with a back-up run six hours
# later; a scheduled run that finds today's (UTC) snapshot already recorded
# does nothing. A manual run always records another snapshot; npm run usage
# uses the latest one for each date.
on:
  schedule:
    - cron: "17 0 * * *" # 00:17 UTC, just after each UTC day ends
    - cron: "17 6 * * *" # back-up, in case that one is dropped
  workflow_dispatch:

permissions:
  contents: write # push to the stats branch

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch download counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | .tag_name as $tag | .assets[] | "\($tag),\(.name),\(.download_count)"' \
            > "$RUNNER_TEMP/rows.csv"
          if [ ! -s "$RUNNER_TEMP/rows.csv" ]; then
            echo "::error::GitHub returned no release assets; nothing recorded."
            exit 1
          fi
          wc -l < "$RUNNER_TEMP/rows.csv"

      - name: Append them to stats/downloads.csv on the stats branch
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          today="${now%%T*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin stats > /dev/null; then
            git fetch --quiet --depth=1 origin stats
            git switch --quiet -c stats FETCH_HEAD
          else
            git switch --quiet --orphan stats
          fi
          mkdir -p stats
          file=stats/downloads.csv
          header="date,tag,asset,download_count,taken_at"
          if [ ! -f "$file" ]; then
            echo "$header" > "$file"
          elif [ "$(head -n 1 "$file")" = "date,tag,asset,download_count" ]; then
            # Rows from before taken_at keep four columns; npm run usage dates them by their commit.
            { echo "$header"; tail -n +2 "$file"; } > "$RUNNER_TEMP/migrated.csv"
            mv "$RUNNER_TEMP/migrated.csv" "$file"
          fi
          if [ "$EVENT" = "schedule" ] && grep -q "^$today," "$file"; then
            echo "Already have a snapshot for $today; nothing to do."
            exit 0
          fi
          sed "s/^/$today,/; s/\$/,$now/" "$RUNNER_TEMP/rows.csv" >> "$file"
          git add "$file"
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit --quiet -m "Download counts for $now"
          git push origin HEAD:refs/heads/stats
